<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A small gift 🎁</title>

    <!-- Anteprima WhatsApp -->
    <meta property="og:title" content="A small gift 🎁">
    <meta property="og:description"
          content="If you are not sure what to gift me, you can put a tiny coin in here ">
    <meta property="og:type" content="website">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,.12);
            text-align: center;
            max-width: 420px;
            margin: 20px;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 28px;
            background: #0070ba;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background: #005ea6;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>🎁 A small gift</h1>

    <p>
        If you are unsure what to gift, 
      here is a few ideas for you 😂
    </p>

    <a class="button"
       href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
        💸 Send the gift
    </a>
</div>

</body>
</html>
