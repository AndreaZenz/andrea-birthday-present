    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: #222;
        }

        /* =========================
           PHOTO BACKGROUND
           ========================= */

        .photo-wall {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #111;
        }

        .photo-row {
            position: absolute;
            left: 0;
            width: max-content;
            display: flex;
            align-items: center;
            gap: 18px;
            will-change: transform;
        }

        .row-1 {
            top: -20px;
            animation: moveLeft1 45s linear infinite;
        }

        .row-2 {
            top: 32%;
            animation: moveLeft2 60s linear infinite;
        }

        .row-3 {
            top: 67%;
            animation: moveLeft3 52s linear infinite;
        }

        .photo {
            width: 190px;
            height: 145px;
            object-fit: cover;
            border-radius: 10px;
            flex-shrink: 0;

            /* Slightly faded so the card stays readable */
            opacity: 0.72;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.35);

            user-select: none;
            pointer-events: none;
        }

        .photo:nth-child(3n) {
            transform: rotate(-2deg);
        }

        .photo:nth-child(3n + 1) {
            transform: rotate(1.5deg);
        }

        .photo:nth-child(3n + 2) {
            transform: rotate(-1deg);
        }

        /* Dark overlay */
        .photo-overlay {
            position: fixed;
            inset: 0;
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.28),
                    rgba(0, 0, 0, 0.42)
                );
            pointer-events: none;
            z-index: 2;
        }

        /* =========================
           CENTER CARD
           ========================= */

        .content {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .card {
            width: min(430px, 100%);

            background: rgba(255, 255, 255, 0.94);

            padding: 42px 36px;

            border-radius: 24px;

            text-align: center;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(8px);
        }

        .emoji {
            font-size: 58px;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 30px;
            line-height: 1.15;
        }

        p {
            margin: 0;
            color: #555;
            font-size: 17px;
            line-height: 1.55;
        }

        .button {
            display: inline-block;

            margin-top: 28px;
            padding: 15px 30px;

            background: #0070ba;
            color: white;

            text-decoration: none;

            border-radius: 999px;

            font-size: 16px;
            font-weight: bold;

            box-shadow:
                0 7px 18px rgba(0, 112, 186, 0.3);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .button:hover {
            background: #005ea6;
            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(0, 112, 186, 0.4);
        }

        .small-text {
            margin-top: 18px;

            font-size: 12px;
            color: #999;
        }

        /* =========================
           ANIMATIONS
           ========================= */

        @keyframes moveLeft1 {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

        @keyframes moveLeft2 {
            from {
                transform: translateX(-15%);
            }

            to {
                transform: translateX(-65%);
            }
        }

        @keyframes moveLeft3 {
            from {
                transform: translateX(-5%);
            }

            to {
                transform: translateX(-55%);
            }
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            .photo {
                width: 145px;
                height: 115px;
            }

            .photo-row {
                gap: 12px;
            }

            .card {
                padding: 34px 25px;
                border-radius: 20px;
            }

            .emoji {
                font-size: 48px;
            }

            h1 {
                font-size: 26px;
            }

            p {
                font-size: 16px;
            }

            .button {
                width: 100%;
                padding: 15px 20px;
            }
        }

        /* Respect reduced-motion preferences */
        @media (prefers-reduced-motion: reduce) {
            .photo-row {
                animation: none;
            }
        }
    </style>
</head>
